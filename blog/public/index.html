<!DOCTYPE html>
<html lang="en" class=">
<head>
    <meta charset="UTF-8">
    <title>Amaranthine – Personal Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- 1️⃣ Your own stylesheet -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>
  <main class="container">
    <header class = "heading">
      <div class="tabs">
        <object id="date">date</object>
      </div>
      <div class="tabs">
        <object id="clock">time</object>
      </div>
    </header>
    <nav class = "navigate">

  <div class="window">

    <div class="toolbar">
      <span id="status">guest</span>
      <button class="btn" id="authBtn">login</button>
    </div>
 
    <!-- login form -->
    <div class="box" id="loginBox">
      <label for="user">username</label>
      <input id="user" autocomplete="username">
      <label for="pass">password</label>
      <input id="pass" type="password" autocomplete="current-password">
      <div class="row">
        <button class="btn" id="loginSubmit">enter</button>
        <span class="error" id="loginError"></span>
      </div>
    </div>
 
    <!-- new post (only visible when logged in) -->
    <div class="box" id="composeBox">
      <div class="stamp" id="stamp"></div>
      <textarea id="newText" placeholder="write a new post..."></textarea>
      <div class="row">
        <button class="btn" id="postBtn">post</button>
        <span class="error" id="postError"></span>
      </div>
    </div>
 
    <div id="feed"></div>
  </div>
</nav>
